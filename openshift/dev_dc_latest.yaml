kind: Template
apiVersion: template.openshift.io/v1
objects:
  - apiVersion: v1
    kind: Service
    spec:
      ports:
        - name: 8080-tcp
          port: 8080
          protocol: TCP
          targetPort: 8080
        - name: 8443-tcp
          port: 8443
          protocol: TCP
          targetPort: 8443
      selector:
        deployment: ${NAME}
      sessionAffinity: None
    metadata:
      name: ${NAME}
      labels:
        deployment: ${NAME}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}
      labels:
        deployment: ${NAME}
        app.kubernetes.io/part-of: ${LABEL_NAME}
    spec:
      replicas: ${{MIN_REPLICAS}}
      revisionHistoryLimit: 5
      selector:
        matchLabels:
          deployment: ${NAME}
      strategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            deployment: ${NAME}
            deploy-branch: ${REPO_BRANCH}
          annotations:
            vault.hashicorp.com/agent-inject: 'true'
            vault.hashicorp.com/agent-inject-token: 'true'
            vault.hashicorp.com/agent-pre-populate-only: 'true'
            vault.hashicorp.com/auth-path: auth/k8s-${OC_CLUSTER}
            vault.hashicorp.com/namespace: platform-services
            vault.hashicorp.com/role: ${LICENSE_PLATE}-${LICENSE_BRANCH}
            vault.hashicorp.com/agent-inject-secret-secrets.env: ${LICENSE_PLATE}-${LICENSE_BRANCH}/${VAULT_ENV}
            vault.hashicorp.com/agent-inject-template-secrets.env: |
              {{- with secret "${LICENSE_PLATE}-${LICENSE_BRANCH}/${VAULT_ENV}" }}
              {{- range $k, $v := .Data.data }}
              {{ $k }}={{ $v }}{{ end -}}
              {{- end  }}
        spec:
          serviceAccountName: ${LICENSE_PLATE}-vault
          volumes:
            - name: site-data-volume
              configMap:
                name: subpath-env
          containers:
            - image: >-
                image-registry.openshift-image-registry.svc:5000/${BUILD_NAMESPACE}/${NAME}:${IMAGE_TAG}
              volumeMounts:
                - name: site-data-volume
                  mountPath: /var/site_data
              imagePullPolicy: Always
              name: ${NAME}
              ports:
                - containerPort: 8080
                  protocol: TCP
                - containerPort: 8443
                  protocol: TCP
              resources:
                limits:
                  cpu: ${CPU_LIMITS}
                  memory: ${MEM_LIMITS}
                requests:
                  cpu: ${CPU_REQUESTS}
                  memory: ${MEM_REQUESTS}
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - '-c'
                      - >
                        touch /var/www/html/storage/logs/laravel.log && tail -f
                        /var/www/html/storage/logs/laravel.log > /proc/1/fd/2 &
              livenessProbe:
                exec:
                  command:
                  - /bin/sh
                  - -c
                  - /var/www/html/probe-check.sh
                initialDelaySeconds: 1000
                periodSeconds: 15
                timeoutSeconds: 5
                successThreshold: 1
                failureThreshold: 3
              env:
              - name: "ENV_ARG"
                value: "hi there"
              - name: BIFROST_BASE_URL
                value: ${BIFROST_BASE_URL}
  # ---- Bifrost AI gateway (OSS, Apache-2.0) ----
  # BCAIGW forwards to this in-cluster service; Bifrost owns provider keys, routing,
  # fallback and load balancing. No Maxim/enterprise key is set, so only OSS
  # features run. Provider keys are supplied via the optional ${BIFROST_KEYS_SECRET}.
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: ${NAME}-bifrost-config
  #     labels:
  #       deployment: ${NAME}-bifrost
  #   data:
  #     config.json: |
  #       {
  #         "$schema": "https://www.getbifrost.ai/schema",
  #         "client": { "drop_excess_requests": false },
  #         "config_store": { "enabled": true, "type": "sqlite", "config": { "path": "/app/data/config.db" } }
  #       }
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${NAME}-bifrost-data
      labels:
        deployment: ${NAME}-bifrost
    spec:
      # Block storage honours fsGroup so OpenShift makes /app/data group-writable;
      # netapp-file (NFS) ignores fsGroup and leaves the volume root:root.
      storageClassName: netapp-block-standard
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: ${BIFROST_STORAGE_SIZE}
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-bifrost
      labels:
        deployment: ${NAME}-bifrost
    spec:
      ports:
        - name: 8080-tcp
          port: 8080
          protocol: TCP
          targetPort: 8080
        - name: 8443-tcp
          port: 8443
          protocol: TCP
          targetPort: 8443
      selector:
        deployment: ${NAME}-bifrost
      sessionAffinity: None
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-bifrost
      labels:
        deployment: ${NAME}-bifrost
        app.kubernetes.io/part-of: ${LABEL_NAME}
    spec:
      replicas: 1
      revisionHistoryLimit: 5
      selector:
        matchLabels:
          deployment: ${NAME}-bifrost
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            deployment: ${NAME}-bifrost
        spec:
          # OpenShift runs this pod with an arbitrary UID and GID 0; fsGroup makes
          # the mounted PVC group-writable so Bifrost can write /app/data.
          securityContext:
            fsGroup: ${{OC_USER_ID}}
          volumes:
            - name: bifrost-data
              persistentVolumeClaim:
                claimName: ${NAME}-bifrost-data
            - name: bifrost-config
              configMap:
                name: ${NAME}-bifrost-config
          containers:
            - name: bifrost
              image: ${BIFROST_IMAGE}
              imagePullPolicy: IfNotPresent
              args: ["-app-dir", "/app/data"]
              ports:
                - containerPort: 8080
                  protocol: TCP
                - containerPort: 8443
                  protocol: TCP
              env:
                - name: APP_HOST
                  value: "0.0.0.0"
                - name: APP_PORT
                  value: "8080"
                - name: APP_SECURE_PORT
                  value: "8443"
                - name: LOG_STYLE
                  value: "json"
              envFrom:
                - secretRef:
                    name: ${BIFROST_KEYS_SECRET}
                    optional: true
              volumeMounts:
                - name: bifrost-data
                  mountPath: /app/data
                - name: bifrost-config
                  mountPath: /app/data/config.json
                  subPath: config.json
              resources:
                requests:
                  cpu: ${BIFROST_CPU_REQUESTS}
                  memory: ${BIFROST_MEM_REQUESTS}
                limits:
                  cpu: ${BIFROST_CPU_LIMITS}
                  memory: ${BIFROST_MEM_LIMITS}
              # readinessProbe:
              #   tcpSocket:
              #     port: 8080
              #   initialDelaySeconds: 10
              #   periodSeconds: 15
              # livenessProbe:
              #   tcpSocket:
              #     port: 8080
              #   initialDelaySeconds: 30
              #   periodSeconds: 20
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-bifrost-allow-same-namespace
      labels:
        deployment: ${NAME}-bifrost
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-bifrost
      ingress:
        - from:
            - podSelector: {}
          ports:
            - protocol: TCP
              port: 8080
            - protocol: TCP
              port: 80
            - protocol: TCP
              port: 443
      policyTypes:
        - Ingress
  # - kind: CronJob
  #   apiVersion: batch/v1
  #   metadata:
  #     name: ${JOB_NAME}
  #     namespace: ${NAMESPACE}
  #     labels:
  #       template: 'nrsts-daily-cronjob'
  #       cronjob: ${JOB_NAME}
  #       app.kubernetes.io/part-of: ${LABEL_NAME}
  #   spec:
  #     schedule: ${SCHEDULE}
  #     concurrencyPolicy: 'Forbid'
  #     successfulJobsHistoryLimit: ${{SUCCESS_JOBS_HISTORY_LIMIT}}
  #     failedJobsHistoryLimit: ${{FAILED_JOBS_HISTORY_LIMIT}}
  #     jobTemplate:
  #       metadata:
  #         labels:
  #           template: 'nrsts-daily-cronjob'
  #           cronjob: ${JOB_NAME}
  #       spec:
  #         backoffLimit: ${{JOB_BACKOFF_LIMIT}}
  #         template:
  #           spec:
  #             containers:
  #               - name: ${JOB_NAME}
  #                 image: image-registry.openshift-image-registry.svc:5000/${BUILD_NAMESPACE}/${NAME}-cron:${IMAGE_TAG}
  #                 command: ["/bin/sh", "-c"]
  #                 env:
  #                   - name: LOGIN_TOKEN
  #                     valueFrom:
  #                       secretKeyRef:
  #                         name: ${LOGIN_TOKEN_SECRET}
  #                         key: token
  #                 args:
  #                   - >
  #                     date

  #                     oc login --token=$(LOGIN_TOKEN) --server=https://api.silver.devops.gov.bc.ca:6443

  #                     oc version

  #                     echo ""

  #                     echo "==========> Starting schedule run"

  #                     oc -n ${NAMESPACE} get pods -l deploymentconfig=${NAME} -o name | xargs -I {} sh -c 'oc exec -it {} -- php artisan job:dispatch-midnight && oc exec -it {} -- php artisan queue:work --once --queue=midnight'

  #                     echo "==========> Finished schedule run"

  #             restartPolicy: 'Never'
  #             terminationGracePeriodSeconds: 30
  #             activeDeadlineSeconds: 220
  #             dnsPolicy: 'ClusterFirst'
  - apiVersion: route.openshift.io/v1
    kind: Route
    spec:
      host: ${NAME}-${NAMESPACE}.apps.silver.devops.gov.bc.ca
      port:
        targetPort: 8080-tcp
      to:
        kind: Service
        name: ${NAME}
        weight: 100
      wildcardPolicy: None
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    metadata:
      name: ${NAME}
      labels:
        deployment: ${NAME}
      annotations:
        haproxy.router.openshift.io/ip_whitelist: 142.22.0.0/12 142.32.0.0/12 142.35.0.0/12
  - apiVersion: route.openshift.io/v1
    kind: Route
    spec:
      host: ${NAME}-bifrost-${NAMESPACE}.apps.silver.devops.gov.bc.ca
      port:
        targetPort: 8080-tcp
      to:
        kind: Service
        name: ${NAME}-bifrost
        weight: 100
      wildcardPolicy: None
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    metadata:
      name: ${NAME}-bifrost
      labels:
        deployment: ${NAME}-bifrost
      annotations:
        haproxy.router.openshift.io/ip_whitelist: 142.22.0.0/12 142.32.0.0/12 142.35.0.0/12

  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: ${NAME}
      labels:
        deployment: ${NAME}
    spec:
      targetRef:
        kind: Deployment
        name: ${NAME}
        apiVersion: apps/v1
      updatePolicy:
        updateMode: "Off"
  - apiVersion: autoscaling/v1
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        deployment: ${NAME}
      name: ${NAME}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-allow-external
      spec:
        podSelector:
          matchLabels:
            deployment: ${NAME}
        ingress:
          - ports:
            - protocol: TCP
              port: 8080
            - protocol: TCP
              port: 80
            - protocol: TCP
              port: 443
        policyTypes:
          - Ingress
parameters:
  - name: OC_USER_ID
    required: false
  - name: NAME
    required: true
    description: some desc for this component
  - name: NAMESPACE
    required: true
    description: some line to describe the image_tag_x parameter
  - name: LABEL_NAME
    required: true
    description: some desc for this component
  - name: IMAGE_TAG
    required: true
    description: some line to describe the image_tag_x parameter
  - name: LICENSE_PLATE
    required: true
  - name: LICENSE_BRANCH
    required: true
  - name: VAULT_ENV
    required: true
  - name: BUILD_NAMESPACE
    required: true
    description: some line to describe the image_tag_x parameter
  - name: REPO_BRANCH
    required: true
    description: some line to describe the image_tag_x parameter
  - name: REPO_NAME
    required: false
  - name: CPU_REQUESTS
    required: true
  - name: CPU_LIMITS
    required: true
  - name: MEM_REQUESTS
    required: true
  - name: MEM_LIMITS
    required: true
  - name: MIN_REPLICAS
    required: true
  - name: MAX_REPLICAS
    required: true
  - name: BUILD_CPU_REQUESTS
    required: false
  - name: BUILD_CPU_LIMITS
    required: false
  - name: BUILD_MEM_REQUESTS
    required: false
  - name: BUILD_MEM_LIMITS
    required: false
  - name: NPM_ENV
    required: false
  - name: BIFROST_IMAGE
    description: Bifrost OSS image (BC Gov artifactory pull-through of docker.io/maximhq/bifrost)
    value: 'artifacts.developer.gov.bc.ca/docker-remote/maximhq/bifrost:v1.3.9'
    required: false
  - name: BIFROST_BASE_URL
    description: In-cluster URL BCAIGW uses to reach Bifrost
    value: 'http://bcaigw-bifrost:8080'
    required: false
  - name: BIFROST_STORAGE_SIZE
    value: '1Gi'
    required: false
  - name: BIFROST_CPU_REQUESTS
    value: '50m'
    required: false
  - name: BIFROST_CPU_LIMITS
    value: '500m'
    required: false
  - name: BIFROST_MEM_REQUESTS
    value: '256Mi'
    required: false
  - name: BIFROST_MEM_LIMITS
    value: '1Gi'
    required: false
  - name: BIFROST_KEYS_SECRET
    description: Optional Secret holding provider API keys as env vars for Bifrost
    value: 'bcaigw-bifrost-provider-keys'
    required: false
  - name: 'JOB_NAME'
    displayName: 'Job Name'
    description: 'Name of the Scheduled Job to Create.'
    value: 'bcaigw-daily-cronjob'
    required: true
  - name: 'SCHEDULE'
    displayName: 'Cron Schedule'
    description: 'Cron Schedule to Execute the Job (in UTC)'
    value: '0 7 * * *' # at 8 UTC (00:00 midnight PST)
    # value: '*/5 * * * *' #every 5 minutes
    # value: '0 * * * *' #at the top of the hour
    required: true
  - name: 'SUCCESS_JOBS_HISTORY_LIMIT'
    displayName: 'Successful Job History Limit'
    description: 'The number of successful jobs that will be retained'
    value: '3'
    required: true
  - name: 'FAILED_JOBS_HISTORY_LIMIT'
    displayName: 'Failed Job History Limit'
    description: 'The number of failed jobs that will be retained'
    value: '3'
    required: true
  - name: 'JOB_BACKOFF_LIMIT'
    displayName: 'Job Backoff Limit'
    description: 'The number of attempts to try for a successful job outcome (default: 6)'
    value: '0'
    required: false
  - name: LOGIN_TOKEN_SECRET
    description: The secret having the login token
    required: true
  - name: OC_CLUSTER
    description: The OpenShift cluster to use
    required: true