name: Reusable OpenShift build & deploy

# Shared implementation behind deploy-dev / deploy-test / deploy-prod.
#
# Two modes:
#   build: true   - build a new image from this ref and tag it sha-<short sha>
#   build: false  - promote an image that already exists in the registry
#
# PROD always promotes. Rebuilding for PROD would produce a different image than
# the one that was tested, which defeats the point of having a TEST environment.
#
# No secret value is ever written into a manifest. Manifests only reference
# Secrets that a platform administrator created in the namespace out of band.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment providing protection rules and approvals.
        required: true
        type: string
      overlay:
        description: Kustomize overlay (dev, test or prod).
        required: true
        type: string
      namespace:
        description: Target OpenShift namespace.
        required: true
        type: string
      registry:
        description: Image registry host, e.g. ghcr.io or image-registry.apps....
        required: true
        type: string
      image_repository:
        description: Repository path within the registry, e.g. bcgov/bcaigw.
        required: true
        type: string
      build:
        description: Build and push a new image. False promotes an existing tag.
        required: false
        default: true
        type: boolean
      image_tag:
        description: Existing tag to promote. Required when build is false.
        required: false
        default: ""
        type: string
    secrets:
      OPENSHIFT_SERVER:
        required: true
      OPENSHIFT_TOKEN:
        required: true
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          BUILD: ${{ inputs.build }}
          REQUESTED: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BUILD" = "true" ]; then
            tag="sha-$(echo "$SHA" | cut -c1-7)"
          else
            if [ -z "$REQUESTED" ]; then
              echo "::error::image_tag is required when build is false"
              exit 1
            fi
            tag="$REQUESTED"
          fi

          # TEST and PROD must never run a floating tag: a rollout has to be
          # reproducible and re-pullable to exactly the same bytes.
          case "$tag" in
            sha-*|sha256:*) ;;
            *)
              if [ "${{ inputs.overlay }}" != "dev" ]; then
                echo "::error::${{ inputs.overlay }} requires an immutable tag (sha-* or sha256:*), got '$tag'"
                exit 1
              fi
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    if: ${{ inputs.build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ inputs.registry }}/${{ inputs.image_repository }}:${{ needs.resolve.outputs.tag }}
          build-args: |
            BUILD_VERSION=${{ needs.resolve.outputs.tag }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        run: |
          echo "Image digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [resolve, build]
    # `always()` plus an explicit result check lets PROD skip the build job
    # without the deploy being skipped along with it.
    if: ${{ always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Point the overlay at this registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REPOSITORY: ${{ inputs.image_repository }}
          OVERLAY: ${{ inputs.overlay }}
        run: |
          set -euo pipefail
          # The committed overlays carry a placeholder registry so the repo has
          # no environment-specific hostnames in it. Rewrite newName here, in
          # the ephemeral runner checkout only.
          file="deploy/openshift/overlays/$OVERLAY/kustomization.yaml"
          sed -i -E "s#^(\s*newName:\s*).*#\1$REGISTRY/$REPOSITORY#" "$file"
          grep -A3 '^images:' "$file"

      - name: Log in to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          oc login --server="$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" >/dev/null 2>&1
          oc project "${{ inputs.namespace }}" >/dev/null

      # Fails the deploy before anything is applied if a required Secret is
      # absent, rather than leaving pods in CreateContainerConfigError.
      - name: Verify required secrets exist
        run: |
          set -euo pipefail
          missing=0
          for secret in bcaigw-app bcaigw-content-keyring; do
            if ! oc -n "${{ inputs.namespace }}" get secret "$secret" >/dev/null 2>&1; then
              echo "::error::missing Secret $secret in ${{ inputs.namespace }}"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy
        run: |
          ./scripts/openshift/deploy.sh "${{ inputs.overlay }}" \
            --image "${{ needs.resolve.outputs.tag }}" \
            --namespace "${{ inputs.namespace }}"

      - name: Smoke test
        run: |
          set -euo pipefail
          # Runs inside the cluster so the check does not depend on the Route,
          # DNS propagation or an egress path back in from the runner.
          oc -n "${{ inputs.namespace }}" run "bcaigw-smoke-$RANDOM" \
            --rm -i --restart=Never --quiet \
            --image=curlimages/curl:latest -- \
            curl -fsS --max-time 15 "http://bcaigw-portal:8080/api/ready"

      - name: Roll back on failure
        if: failure()
        run: |
          ./scripts/openshift/deploy.sh rollback "${{ inputs.overlay }}" \
            --namespace "${{ inputs.namespace }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.overlay }} deploy"
            echo ""
            echo "- namespace: \`${{ inputs.namespace }}\`"
            echo "- image: \`${{ inputs.registry }}/${{ inputs.image_repository }}:${{ needs.resolve.outputs.tag }}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
