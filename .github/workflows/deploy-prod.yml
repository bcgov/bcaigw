name: Deploy PROD

# PROD never builds. It promotes an image tag that has already been deployed to
# and exercised in TEST, so the bytes that reach production are the bytes that
# were tested. A rebuild - even from the identical commit - can differ because
# base images and OS packages move.
#
# Protect the `prod` GitHub environment with required reviewers and, if
# desired, a wait timer. That protection is what makes this workflow safe to
# expose as a manual dispatch.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable tag to promote, e.g. sha-1a2b3c4.
        required: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/reusable-build-deploy.yml
    with:
      environment: prod
      overlay: prod
      namespace: ${{ vars.OPENSHIFT_NAMESPACE_PROD }}
      registry: ${{ vars.OPENSHIFT_REGISTRY }}
      image_repository: ${{ vars.OPENSHIFT_IMAGE_REPOSITORY }}
      build: false
      image_tag: ${{ inputs.image_tag }}
    secrets:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER_PROD }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN_PROD }}
