name: OpenShift manifests

# Renders and structurally validates the Kustomize overlays on every change to
# the deployment tree. This is deliberately separate from CI: it needs no
# database or Node toolchain, so it gives fast feedback on manifest edits.

on:
  pull_request:
    paths:
      - "deploy/openshift/**"
      - "scripts/openshift/**"
      - ".github/workflows/openshift-manifests.yml"
  push:
    branches: [main, dev]
    paths:
      - "deploy/openshift/**"
      - "scripts/openshift/**"
      - ".github/workflows/openshift-manifests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, zip
          coverage: none

      # symfony/yaml powers the validator. --no-scripts skips the Laravel
      # post-install hooks, which would need an app key and a database.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check YAML is parseable
        run: |
          php -r '
            require "vendor/autoload.php";
            $failed = 0;
            $files = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("deploy/openshift"));
            foreach ($files as $file) {
              if (! preg_match("/\.ya?ml$/", $file->getFilename())) { continue; }
              try {
                Symfony\Component\Yaml\Yaml::parseFile($file->getPathname());
              } catch (Throwable $e) {
                fwrite(STDERR, $file->getPathname().": ".$e->getMessage()."\n");
                $failed++;
              }
            }
            exit($failed === 0 ? 0 : 1);
          '

      # kubectl ships a recent embedded kustomize, so no extra install is
      # needed; render.sh picks whichever of kustomize/kubectl/oc it finds.
      - name: Render every overlay
        run: |
          for overlay in dev test prod; do
            ./scripts/openshift/render.sh "$overlay" --out "build/openshift/$overlay.yaml"
          done

      - name: Validate manifests
        run: ./scripts/openshift/validate.sh

      # Server-side schema validation. Skipped rather than failed when no
      # cluster is reachable, so forks and PRs from outside the org still pass.
      - name: Dry-run against the cluster schema
        if: ${{ vars.OPENSHIFT_SERVER != '' }}
        env:
          OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          oc login --server="$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"
          for overlay in dev test prod; do
            oc apply -f "build/openshift/$overlay.yaml" --dry-run=server \
              -n "bcaigw-$overlay" || exit 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: build/openshift/
          retention-days: 14
